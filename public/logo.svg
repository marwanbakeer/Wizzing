<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Glowing geometric T/W block hybrid -->
  <g filter="url(#glow)" transform="translate(46, 60)">
    <!-- Top Bar (Cyan) -->
    <rect x="70" y="70" width="80" height="80" rx="18" fill="url(#cyanGrad)"/>
    <rect x="170" y="70" width="80" height="80" rx="18" fill="url(#cyanGrad)"/>
    <rect x="270" y="70" width="80" height="80" rx="18" fill="url(#cyanGrad)"/>

    <!-- Middle Pillar (Purple) -->
    <rect x="170" y="170" width="80" height="80" rx="18" fill="url(#purpleGrad)"/>

    <!-- Bottom Wings (Amber / Gold) -->
    <rect x="70" y="270" width="80" height="80" rx="18" fill="url(#amberGrad)"/>
    <rect x="170" y="270" width="80" height="80" rx="18" fill="url(#amberGrad)"/>
    <rect x="270" y="270" width="80" height="80" rx="18" fill="url(#amberGrad)"/>
  </g>

  <!-- High-tech grid overlay dots -->
  <circle cx="256" cy="256" r="3" fill="#00f2fe" opacity="0.8"/>
  <circle cx="156" cy="256" r="2" fill="#4facfe" opacity="0.4"/>
  <circle cx="356" cy="256" r="2" fill="#4facfe" opacity="0.4"/>
</svg>
