<!doctype html>
<html lang="en" class="h-full select-none overflow-hidden bg-wizz-darker text-white">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Wizzing — Quantum Block Odyssey</title>
    
    <!-- Apple iOS Full Screen & Standalone App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wizzing" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    
    <!-- Android / PWA Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#05070a" />
    <meta name="description" content="Wizzing: Next-generation tactile block puzzle game with multi-stage campaign, 120 FPS physics, and universal ergonomics." />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <style>
      /* Safe area insets for iOS notches and Android status bars */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
        background-color: #05070a;
      }
    </style>
  </head>
  <body class="h-full w-full overflow-hidden bg-wizz-darker">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
